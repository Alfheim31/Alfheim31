  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>
<rect width="1200" height="190" rx="18" fill="#0D1117"/>
<rect width="1200" height="190" rx="18" fill="url(#honey)"/>
