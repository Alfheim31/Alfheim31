<text x="600" y="72" text-anchor="middle" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#E6EDF3">Next stop: <tspan fill="#F9AB00">wherever the next good idea is.</tspan></text>
<text x="600" y="100" text-anchor="middle" font-family="'SF Mono','JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8B949E">thanks for riding along · come build something with me</text>
